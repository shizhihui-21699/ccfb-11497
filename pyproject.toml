[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomlone"
version = "0.1.0"
description = "From-scratch TOML 1.0 parser with differential fuzzing harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fuzz = ["rtoml>=0.10", "pytomlpp>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
